[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-cli"
version = "0.1.2"
description = "Performance layer for coding agents. Skills, instincts, memory, security and research-first for Claude Code, Codex, Opencode, Cursor, Kiro CLI, Kiro."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TheElephantCoder" }]
keywords = ["agent", "harness", "claude-code", "opencode", "codex", "cursor", "kiro", "kiro-cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.3"]

[project.scripts]
harness = "harness.cli:main"

[project.urls]
Homepage = "https://github.com/TheElephantCoder/agent-harness"
Repository = "https://github.com/TheElephantCoder/agent-harness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
